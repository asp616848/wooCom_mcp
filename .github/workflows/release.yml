# Release (D20, P13): multi-arch (amd64 + arm64) images -> ghcr.io/<owner>/wmg-<svc>:<short sha>.
# The VPS (Oracle A1) is arm64; laptops and CI are mostly amd64. Packages are set public once (no pull secrets).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { svc: gateway, context: ., dockerfile: services/gateway/Dockerfile }
          - { svc: woo-mcp, context: ., dockerfile: services/woo-mcp/Dockerfile }
          - { svc: mcp-gst, context: ., dockerfile: services/mcp-gst/Dockerfile }
          - { svc: mcp-pincode, context: ., dockerfile: services/mcp-pincode/Dockerfile }
          - { svc: dashboard, context: services/dashboard, dockerfile: services/dashboard/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - id: meta
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/wmg-${{ matrix.svc }}:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.svc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc }}
