[project]
name = "wmg-gateway"
version = "0.1.0"
description = "Woo MCP Gateway: one authenticated MCP endpoint in front of many MCP servers, plus the dashboard API"
requires-python = ">=3.14,<3.15"
# Further pins arrive with the phase that uses them (kubernetes: P14), per DECISIONS §Versions.
dependencies = [
    "wmg-common",
    "mcp==2.3.0",
    "httpx2==2.13.1",
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "asyncpg==0.31.0",
    "prometheus-client==0.26.0",
    "PyJWT==2.15.1",
    "cryptography==50.0.2",
    "tzdata==2026.4",
    "openai==3.24.0",
]

[tool.uv.sources]
wmg-common = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wmg_gateway"]
