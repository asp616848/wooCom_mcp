[project]
name = "mcp-pincode"
version = "0.1.0"
description = "Demo delivery/pincode checker MCP server (bundled data, no network)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "wmg-common",
    "mcp==2.3.0",
    "uvicorn[standard]==0.54.0",
]

[tool.uv.sources]
wmg-common = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_pincode"]
