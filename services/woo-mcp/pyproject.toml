[project]
name = "woo-mcp"
version = "0.1.0"
description = "WooCommerce MCP server for one store (internal; reached only through the gateway)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "wmg-common",
    "mcp==2.3.0",
    "httpx2==2.13.1",
    "uvicorn[standard]==0.54.0",
    "tzdata==2026.4",
]

[tool.uv.sources]
wmg-common = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/woo_mcp"]
