[project]
name = "wmg-common"
version = "0.1.0"
description = "Shared helpers for Woo MCP Gateway services: logging, settings, static-credential auth, health, errors, upstream MCP app"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "structlog==26.1.0",
    "mcp==2.3.0",
    # version resolved by uv.lock from the mcp/fastapi constraints (DECISIONS §Versions)
    "starlette",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wmg_common"]
