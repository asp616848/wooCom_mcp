apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    {{- include "mcp-platform.labels" (list . "dashboard") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mcp-platform.selectorLabels" (list . "dashboard") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    {{- include "mcp-platform.labels" (list . "dashboard") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mcp-platform.selectorLabels" (list . "dashboard") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-platform.labels" (list . "dashboard") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      # uid 101 = nginx in the nginx-unprivileged image
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: {{ include "mcp-platform.image" .Values.dashboard.image | quote }}
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext:
            {{- include "mcp-platform.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
