# Gateway state (D16). Not the store's MariaDB: the platform must not depend on a tenant store.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "mcp-platform.labels" (list . "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mcp-platform.selectorLabels" (list . "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "mcp-platform.labels" (list . "postgres") | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "mcp-platform.selectorLabels" (list . "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-platform.labels" (list . "postgres") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      # uid/gid 70 = postgres in the alpine image; fsGroup makes the volume writable for it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: wmg
            - name: POSTGRES_DB
              value: wmg
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-platform.secretName" . }}
                  key: postgres-password
            # subdirectory: the volume root contains lost+found on some storage classes
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "wmg", "-d", "wmg", "-h", "127.0.0.1"]
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "wmg", "-d", "wmg", "-h", "127.0.0.1"]
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "wmg", "-d", "wmg", "-h", "127.0.0.1"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
