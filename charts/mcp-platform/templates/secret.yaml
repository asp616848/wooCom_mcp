{{- if not .Values.existingSecret }}
{{- $name := include "mcp-platform.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}{{ $data = $existing.data }}{{ end }}
# Platform secrets (DESIGN §8.2). Generated once, then preserved across upgrades and uninstall.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mcp-platform.labels" (list . "credentials") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ get $data "postgres-password" | default (randAlphaNum 32 | b64enc) }}
  api-key-pepper: {{ get $data "api-key-pepper" | default (randAlphaNum 48 | b64enc) }}
  # AES-256 key: base64 text of 32 random bytes (the Secret stores that text base64-encoded again).
  credential-encryption-key: {{ get $data "credential-encryption-key" | default (randAlphaNum 32 | b64enc | b64enc) }}
  jwt-secret: {{ get $data "jwt-secret" | default (randAlphaNum 48 | b64enc) }}
  admin-password: {{ get $data "admin-password" | default (randAlphaNum 20 | b64enc) }}
{{- end }}
