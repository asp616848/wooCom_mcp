# Production-like (VPS / k3s) overrides (DESIGN §17). `make ENV=prod platform` sets the hosts
# (<label>.<ip-dashed>.sslip.io), image repositories (GHCR), kubeApiCIDRs and provisioning.storeHostTemplate
# ({name}.shop.<ip-dashed>.sslip.io); secrets come from scripts/prod-secrets.sh.
hosts:
  dashboard: dashboard.example.com
  gateway: gateway.example.com
scheme: https

ingress:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true

existingSecret: platform-credentials

postgres:
  persistence:
    size: 5Gi
    storageClass: local-path

gateway:
  replicas: 2
  cookieSecure: true
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "1", memory: 512Mi }
  pdb:
    enabled: true
  llm:
    model: gemini-3-flash-preview   # PLAN P10.1 rule, 2026-10-10

# Bonus stores get https + a Let's Encrypt cert each (woo-store values-prod.yaml), on the prod store profile.
provisioning:
  storeHostTemplate: "{name}.shop.example.com"
  storeScheme: https
  storeValuesEnv: prod
