{{- if not .Values.existingSecret }}
{{- $name := include "woo-store.secretName" . }}
{{- /* lookup reads the live Secret from the cluster (empty on first install / helm template). */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}{{ $data = $existing.data }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "woo-store.labels" (list . "store-credentials") | nindent 4 }}
  annotations:
    # Survive `helm uninstall`: the DB volume also survives, and it only knows the old password.
    helm.sh/resource-policy: keep
type: Opaque
data:
  mariadb-root-password: {{ include "woo-store.secretValue" (list $data "mariadb-root-password" (randAlphaNum 32)) }}
  mariadb-password: {{ include "woo-store.secretValue" (list $data "mariadb-password" (randAlphaNum 32)) }}
  wordpress-admin-password: {{ include "woo-store.secretValue" (list $data "wordpress-admin-password" (randAlphaNum 24)) }}
  # WooCommerce REST credential in Woo's own format (ck_/cs_ + 40 hex chars). Only becomes
  # valid once the setup Job registers it in WooCommerce (hashed with wc_api_hash).
  wc-consumer-key: {{ include "woo-store.secretValue" (list $data "wc-consumer-key" (printf "ck_%s" (sha1sum (randAlphaNum 40)))) }}
  wc-consumer-secret: {{ include "woo-store.secretValue" (list $data "wc-consumer-secret" (printf "cs_%s" (sha1sum (randAlphaNum 40)))) }}
  # Bearer token the gateway must present to this store's MCP server.
  mcp-token: {{ include "woo-store.secretValue" (list $data "mcp-token" (randAlphaNum 48)) }}
{{- end }}
