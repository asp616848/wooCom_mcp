# Production-like (VPS / k3s) overrides.

store:
  host: shop.example.com # `make ENV=prod` sets shop.<ip-dashed>.sslip.io from VPS_IP in .env.prod
  scheme: https

ingress:
  annotations:
    # cert-manager ClusterIssuers from deploy/k3s/cluster-issuers.yaml; `CERT_ISSUER=letsencrypt-staging` to test.
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: shop-tls

# Created beforehand by scripts/prod-secrets.sh (`make prod-secrets`); the Makefile passes <store>-store-credentials.
existingSecret: main-store-credentials

mariadb:
  persistence:
    size: 10Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

wordpress:
  environmentType: production
  persistence:
    size: 10Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi
