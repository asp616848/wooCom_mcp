# In-cluster address: http://<release>.<namespace>.svc.cluster.local:<port><path>
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "mcp-server.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mcp-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
